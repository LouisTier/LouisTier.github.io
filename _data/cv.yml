- title: Experience
  type: time_table
  contents:
    - title: Computer Vision Scientist
      institution: <a href="https://www.augmodo.com/">Augmodo</a> (part-time alongside PhD)
      year: 2025 - now
      maindescription: "Real-time Spatial AI for retail: open-world computer vision across 100k+ images a day."
      description:
        - Working alongside <a href="https://www.sachahu.com/">Sacha Hu</a> (Senior CV Engineer), <a href="https://www.linkedin.com/in/ashleyanapier/">Ashley Napier</a> (CV Group Lead), and <a href="https://www.linkedin.com/in/galenhan/">Galen Han</a> (Senior CV Engineer).
        - "Developed open-world VLMs that recognize products, aisles, and price tags from images alone, trained on paired images and product descriptions for identification and planogram matching."
        - "Used test-time augmentation to estimate the confidence of open-world classifiers (product identification, QC automation) and flag the uncertain predictions for human QC, across 100k+ images/day."
        - "Fine-tuned YOLO and the transformer-based RF-DETR with hard-negative mining and multi-GPU cloud training, to suppress confirmed empty-shelf false positives without degrading other shelf classes."
        - "Built the RGB+depth version of a classifier that checks empty-shelf alerts, with depth estimated by Depth Anything V2 as a fourth input channel, to tell true gaps from dark or shadowed shelves."
        - "Designed automated relabeling pipelines that update legacy bounding-box annotations at scale, adapting large datasets to newer architectures without manual re-annotation."
    - title: ML Research Engineer (CIFRE PhD)
      institution: <a href="https://www.michelin.com/">Michelin</a>, Clermont-Ferrand, France
      year: 2024 - now
      maindescription: Conformal and adaptive soft sensors for real-time quality prediction in industrial batch processes.
      description:
        - Supervised by <a href="https://www.linkedin.com/in/guillaume-ramelet-7696081/">Guillaume Ramelet</a> and <a href="https://www.linkedin.com/in/moreaudmaxime/">Dr. Maxime Moreaud</a>.
        - Introduced <a href="https://arxiv.org/abs/2606.29403">Self-Organized Conformal Prediction</a> (<strong>NeurIPS 2026</strong>), unsupervised group discovery with a Self-Organizing Map for group-local calibration, cutting regional coverage gaps on all 10 datasets, by 14.8% on average, for only 3% larger prediction sets.
        - "Co-developed Mask-Valid Conformal Prediction (with M. Hegazy, M. I. Jordan, A. Dieuleveut): binary monitoring masks that interpolate between marginal and anytime coverage, with restart validity after failures and no need for past test labels."
        - Created and open-sourced <a href="https://github.com/michelin/TorchSOM">TorchSOM</a> (<strong>JMLR 2026</strong>), a PyTorch library for Self-Organizing Maps, 81-98% faster than MiniSom on CPU, up to about 12× faster than somoclu on GPU, and the lowest topographic error in every rectangular-map benchmark (62-100% below MiniSom).
        - Developed adaptive Just-in-Time soft sensors pairing SOM similarity retrieval with online SHAP feature selection, cutting MSE by up to 61% over global baselines (<strong>IEEE ETFA 2026</strong>) and prediction error by over 90% under year-long drift on 35k production batches.
        - Built an explainable analytics framework (frequency-ranked feature selection, SHAP interactions, multi-split conformal prediction) on 35k rubber-mixing records, cutting 316 input variables to 20 at equal accuracy (<strong>Digital Chemical Engineering 2026</strong>).
    - title: Teaching Assistant (Machine Learning & Data Science)
      institution: <a href="https://www.ensta-paris.fr/">ENSTA Paris</a>
      year: 2024 - 2026
      maindescription: "Led the lab sessions of Introduction to Machine Learning and Data Science for first-year engineering students (B3/MSc1): 20h a year for three consecutive years, 20 to 25 students per session."
      description:
        - Taught the fundamentals of machine learning, from data preprocessing and feature engineering to model training and evaluation, under <a href="https://perso.ensta-paris.fr/~philippe.xu/">Pr. Philippe Xu</a>.
        - "Guided students through their first hands-on experience building and validating predictive models."
    - title: Research Assistant (ML & Optimization)
      institution: <a href="https://www.imperial.ac.uk/adaptive-intelligent-robotics/">Adaptive & Intelligent Robotics Lab (AIRL)</a>, Imperial College London
      year: 2023
      maindescription: Sample-efficient Quality-Diversity optimization using surrogate models for robotic control in uncertain environments.
      description:
        - Supervised by <a href="https://www.imperial.ac.uk/people/a.cully">Pr. Antoine Cully</a>.
        - "Tackled the data-hunger of MAP-Elites by integrating probabilistic surrogate models on a robotic arm control task; the best variant beat MAP-Elites and came close to MAP-Elites with sampling."
        - "Benchmarked eight algorithmic variants combining different surrogate architectures and acquisition strategies in non-deterministic environments."
        - "Introduced two metrics for the uncertainty of quality-diversity archives."
    - title: Research Intern (ML & Neuroscience)
      institution: <a href="https://cerco.cnrs.fr/">CNRS (CerCo)</a>, Toulouse, France
      year: 2022
      maindescription: Deep learning for detecting fast ripples, pathological biomarkers for epileptic tissue, in intracranial EEG signals.
      description:
        - Supervised by <a href="https://www.linkedin.com/in/ludovic-gardy/">Dr. Ludovic Gardy</a>, <a href="https://www.linkedin.com/in/christophe-hurter-2514393/">Pr. Christophe Hurter</a>, and <a href="https://www.linkedin.com/in/emmanuel-barbeau-153b151b9/">Pr. Emmanuel Barbeau</a>.
        - Trained CNN fast-ripple detectors on wavelet time-frequency images of macro- and micro-electrode EEG, improving accuracy by 5% through systematic hyperparameter tuning (<strong>J. Neurosci. Methods 2025</strong>).
        - "Applied Grad-CAM to localize high-frequency bursts in time-frequency maps, giving clinicians visual explanations anchored to known fast-ripple signatures."
        - "Accelerated EEG signal and image processing by 15% with Cython, and built 7 NoSQL databases for multi-channel EEG at macro and micro electrode scales for batch retrieval and parallel processing."
    - title: Research Assistant (ML & Computer Vision)
      institution: <a href="https://dhm.euromov.eu/">EuroMov Digital Health in Motion (DHM)</a>, Montpellier, France
      year: 2022
      maindescription: Anisotropic image filtering for sub-pixel accurate line feature detection, published at IEEE ICASSP 2023.
      description:
        - Supervised by <a href="https://cv.hal.science/baptiste-magnier">Pr. Baptiste Magnier</a> and <a href="https://www.researchgate.net/scientific-contributions/Binbin-Xu-2190252279">Pr. Binbin Xu</a>.
        - "Designed the 2D Semi Bi-Gaussian (2DSBG) filter, an asymmetric convolution kernel that enhances elongated structures while suppressing isotropic noise."
        - "Benchmarked against state-of-the-art edge detection models (DexiNed, RCF, Laplacian-of-Gaussian) on synthetic and real-world datasets."

