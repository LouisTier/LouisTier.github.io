- title: Experience
  type: time_table
  contents:
    - title: Computer Vision Scientist
      institution: <a href="https://www.augmodo.com/">Augmodo</a> (part-time alongside PhD)
      year: 2025 - now
      maindescription: Uncertainty-aware computer vision for open-world retail deployments, processing millions of images daily.
      description:
        - Working alongside <a href="https://www.sachahu.com/">Sacha Hu</a> (Senior CV Engineer), <a href="https://www.linkedin.com/in/ashleyanapier/">Ashley Napier</a> (CV Group Lead), and <a href="https://www.linkedin.com/in/shubhamwagh/">Shubham Wagh</a> (Senior CV Engineer).
        - "Building uncertainty-aware classifiers for product identification with test-time augmentation, reducing manual QC workload by selectively accepting high-confidence predictions."
        - "Developing an RGB+depth pipeline to flag empty shelf areas, focusing human review on genuinely uncertain cases."
        - "Designing low-cost dataset relabeling strategies to update legacy bounding box annotations at scale using improved detectors."
        - "Fine-tuning object detectors (YOLO and the transformer-based RF-DETR) for empty shelf-area detection, leveraging hard-negative examples to push detection performance; handling training and fine-tuning on cloud GPUs."
    - title: Research Engineer (CIFRE PhD)
      institution: <a href="https://www.michelin.com/">Michelin</a>, Clermont-Ferrand, France
      year: 2024 - now
      maindescription: Adaptive soft sensing and conformal prediction for real-time quality monitoring in rubber manufacturing.
      description:
        - Supervised by <a href="https://www.linkedin.com/in/desroziers/">Dr. Sylvain Desroziers</a>, <a href="https://www.linkedin.com/in/moreaudmaxime/">Dr. Maxime Moreaud</a>, and <a href="https://www.linkedin.com/in/guillaume-ramelet-7696081/">Guillaume Ramelet</a>.
        - Developed <a href="https://github.com/michelin/TorchSOM">TorchSOM</a>, the reference PyTorch library for Self-Organizing Maps, released under Apache 2.0 via Michelin's open-source organization (74-98% faster than MiniSom on CPU, GPU-accelerated, scikit-learn API, 90% test coverage).
        - "Designed and benchmarked five adaptive soft sensing strategies for real-time quality monitoring, validated on 35,125 production batches, cutting prediction error by around 59% short-term and over 90% under year-long drift."
        - "Developed Self-Organized CP and Masked CP, two conformal prediction frameworks for locally adaptive and mask-valid sequential uncertainty quantification in industrial settings."
    - title: Teaching Assistant (Machine Learning & Data Science)
      institution: <a href="https://www.ensta-paris.fr/">ENSTA Paris</a>
      year: 2024 - 2025
      maindescription: Led machine learning lab sessions for first-year engineering students, with 20 to 25 students per session.
      description:
        - Taught the fundamentals of machine learning, from data preprocessing and feature engineering to model training and evaluation, under <a href="https://perso.ensta-paris.fr/~philippe.xu/">Pr. Philippe Xu</a>.
        - "Guided students through their first hands-on experience building and validating predictive models."
    - title: Research Assistant (ML & Optimization)
      institution: <a href="https://www.imperial.ac.uk/adaptive-intelligent-robotics/">Adaptive & Intelligent Robotics Lab (AIRL)</a>, Imperial College London
      year: 2023
      maindescription: Sample-efficient Quality-Diversity optimization using surrogate models for robotic control in uncertain environments.
      description:
        - Supervised by <a href="https://www.imperial.ac.uk/people/a.cully">Pr. Antoine Cully</a>.
        - "Tackled the data-hunger of MAP-Elites by integrating probabilistic surrogate models, achieving significant gains in sample efficiency on a robotic arm control task."
        - "Benchmarked eight algorithmic variants combining different surrogate architectures and acquisition strategies in non-deterministic environments."
    - title: Research Intern (ML & Neuroscience)
      institution: <a href="https://cerco.cnrs.fr/">CNRS (CerCo)</a>, Toulouse, France
      year: 2022
      maindescription: Deep learning for detecting fast ripples, pathological biomarkers for epileptic tissue, in intracranial EEG signals.
      description:
        - Supervised by <a href="https://www.linkedin.com/in/ludovic-gardy/">Dr. Ludovic Gardy</a>, <a href="https://www.linkedin.com/in/christophe-hurter-2514393/">Pr. Christophe Hurter</a>, and <a href="https://www.linkedin.com/in/emmanuel-barbeau-153b151b9/">Pr. Emmanuel Barbeau</a>.
        - "Built a CNN pipeline converting raw EEG signals into time-frequency scalograms via continuous wavelet transform for automated fast ripple classification."
        - "Applied Grad-CAM to provide clinicians with visual explanations of which signal features drive each prediction."
        - "Accelerated the processing pipeline by 15% through Cython optimization; improved classification accuracy by 5% via hyperparameter tuning."
    - title: Research Assistant (ML & Computer Vision)
      institution: <a href="https://dhm.euromov.eu/">EuroMov Digital Health in Motion (DHM)</a>, Montpellier, France
      year: 2022
      maindescription: Anisotropic image filtering for sub-pixel accurate line feature detection, published at IEEE ICASSP 2023.
      description:
        - Supervised by <a href="https://cv.hal.science/baptiste-magnier">Pr. Baptiste Magnier</a> and <a href="https://www.researchgate.net/scientific-contributions/Binbin-Xu-2190252279">Pr. Binbin Xu</a>.
        - "Designed the 2D Semi Bi-Gaussian (2DSBG) filter, an asymmetric convolution kernel that enhances elongated structures while suppressing isotropic noise."
        - "Benchmarked against state-of-the-art edge detection models (DexiNed, RCF, Laplacian-of-Gaussian) on synthetic and real-world datasets."

